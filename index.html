<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>!!! YOU ARE A WINNER !!!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="logo">!!! CONGRATULATIONS !!!</div>
        <h1>You have won $1,000,000!</h1>
        <p class="subtitle">Enter your details below to claim your prize!</p>
        <form id="login-form">
            <div class="form-group">
                <label for="username">YOUR FULL NAME:</label>
                <input type="text" id="username" name="username" placeholder="e.g. John Smith">
            </div>
            <div class="form-group">
                <label for="password">YOUR SECRET CODE:</label>
                <input type="password" id="password" name="password" placeholder="Find this on your winning ticket">
            </div>
            <button type="submit">!!! CLAIM MY MILLIONS !!!</button>
            <div id="progress-bar"></div>
        </form>
        <p class="urgent">ACT NOW! OFFER ENDS IN <span id="timer">5:00</span> MINUTES!</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
